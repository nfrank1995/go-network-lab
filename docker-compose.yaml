services:
  go-server:
    image: golang:1.26-alpine
    container_name: go-server
    volumes: 
      - ./server:/app
    working_dir: /app
    command: go run main.go
    networks:
        - lab-net

  go-client:
    image: golang:1.26-alpine
    container_name: go-client
    volumes: 
      - ./client:/app
    working_dir: /app
    command: go run main.go
    networks:
        - lab-net
  network-probe:
    image: ubuntu:latest
    container_name: network-probe
    networks:
      - lab-net
    tty: true
    stdin_open: true

networks:
  lab-net:
    driver: bridge
